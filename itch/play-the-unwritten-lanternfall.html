.px-nm:active { transform: translateY(1px); }
.px-ring { position: absolute; left: 3px; top: 2px; width: 34px; height: 34px; border-radius: 50%;
  background: conic-gradient(var(--el) calc(var(--ms) * 360deg), #ffffff14 0);
  -webkit-mask: radial-gradient(circle, transparent 15px, #000 15.5px); mask: radial-gradient(circle, transparent 15px, #000 15.5px); }
.px-face { position: absolute; left: 4px; top: 3px; width: 32px; height: 32px; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
.px-lv { position: absolute; left: 2px; bottom: 6px; font-size: 10px; line-height: 1; font-weight: 700; color: #f2e8d8;
  text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; font-variant-numeric: tabular-nums; }
.px-dot { position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--el); box-shadow: 0 0 0 1px #000; }
.px-share { position: absolute; left: 3px; right: 3px; bottom: 2px; height: 3px; background: #ffffff1a; border-radius: 2px; overflow: hidden; }
.px-share u { display: block; height: 100%; background: var(--el); text-decoration: none; }
.px-nm.aff { border-color: #e9b949; box-shadow: 0 0 6px #e9b94999; animation: px-glow 1.4s ease-in-out infinite; }
.px-nm.imm .px-face, .px-nm.imm .px-ring { filter: grayscale(1) brightness(.55); }
.px-nm.imm .px-lv { color: #9a9088; }
.px-imm { position: absolute; left: 0; right: 0; top: 4px; text-align: center; font-size: 26px; line-height: 32px; font-style: normal; color: #e25b5bdd; pointer-events: none; }
.px-nm.px-hot { border-color: var(--el); filter: brightness(1.5); }
.px-all { flex: 0 0 auto; min-width: 54px; height: 48px; padding: 0 8px; border: 1px solid #3a3242; border-radius: 6px; background: #2a2430;
  color: #e9e1d2; font: inherit; font-size: 13px; line-height: 1.1; cursor: pointer; touch-action: manipulation; }
.px-all small { display: block; font-size: 10px; color: #9a9088; }
.px-lv small { font-size: 7px; font-weight: 400; margin-right: 1px; opacity: 0.8; }
.px-ic { image-rendering: pixelated; image-rendering: crisp-edges; vertical-align: middle; }
.px-item { border-radius: 4px; background: #00000059; box-shadow: inset 0 0 0 1px var(--rc, #3a3242); }
@keyframes px-glow { 50% { box-shadow: 0 0 11px #e9b949cc; } }
@media (prefers-reduced-motion: reduce) { .px-nm.aff { animation: none; } }

de; every other node now does its own job. Human: Marks, and a chance to skip ahead a stage. Elf: more treasure foes and fairies. Orc: Bloodcry finishes off normal foes at low health. Troll: more time in dungeons. Points you spent stay where they are.`,`**A calmer start.** Tabs open one at a time: Quests at stage 5, Skills at 15 (a Mage gets them with its first class point), Gear at 25, Death at 40; Pets with your first egg. Bosses drop items less often (15%, every 10th for sure, from stage 25); normal foes now and then drop a Common item, elites, treasure foes and wanderers 5%. The first 30 quests give fewer class and transformation points, and race levels come about a third slower. Locked tabs show the stage they open at.`,`Character creation scrolls on every phone, ends on the Faith step (type your name in the box at the top), and has no Begin now button.`,`Holding a button for its details no longer selects the text. The tap counter on the fight now says streak.`,`New class descriptions that name all three subclasses.`,`Every item that reaches your bag is announced (worse drops are still salvaged for gold). The Cleric's Prayer quest says what "high" means: above 50%.`,`Clearer labels: the Named portraits under the fight show "Lv", the button beside them says "Named ›" and how many more you can hire, and the Hero tab says XP level (your race points) apart from Training.`,`Character creation ticks your current pick. The points hint says which kind of point is waiting (class, race or transformation), and the immunity hint says what still hurts the foe.`,`Fixed: the stage dots under a foe kept growing while you farmed a stage. Fixed: an escape gate could be sized far beyond what you could finish; it now checks your real damage once and shrinks if it was clearly impossible (never enough to win without fighting).`]},{h:`New in 2.5`,items:[`**Class gear.** Every class has 3 sets (weapons, accessories, armour), 2 legendaries and 1 Artifact that change how its loop plays: the Warrior's Rage Strikes fire up all your damage, the Mage's casts surge it, the Rogue's combo grows it, the Ranger's arrows mark the foe, the Cleric's Prayer goes higher. Dungeons drop them; gear made for another class gives its stats only until you Reshape.`,`**The Stash** (Gear > Stash): keep set pieces aside. Every complete set in the Stash (up to 10) gives +2% of your worn gear's stats and a small form of its bonus.`,`**Found** (Gear > Found): every land hides 2 named items that its bosses drop now and then. 26 to find; 5, 13 and 26 found give gems.`,`**Vigil**: while you are away, a Cleric climbs toward 90% of their best stage (a full climb takes 8 hours) and comes back with full Prayer.`,`Compare now tells you when a piece completes a set, so a set piece is never marked Worse for that reason. Live set bonuses show on your class meter.`,`Quest 2 now practises your class (Rage Strikes, spells, weak spots, foes, Prayer) instead of 500 taps. When your race or faith rule works, a ⚑ note says so, and Hero > Stats counts it for this life. A boss that runs out your clock now says so clearly, and a finished quest is claimed from the quest bar in one tap.`,`**Judge gear by** (Bag tab, or Settings): Balanced, Tap damage, Named damage, or Gold and boss time. The bag arrows, Compare and auto-salvage all follow it.`]},{h:`New in 2.4`,items:[`**Every class plays its own way.** Warrior: taps build Rage for a 25x Rage Strike. Mage: taps refill mana, spells hit twice as hard. Rogue: weak spots hit 5x and build a crit combo. Ranger: arrows fly by themselves, pets hit 50% harder. Cleric: taps build Prayer that lifts your Named up to 3x.`,`**Races and faiths are rules now**, and help every class the same. Each race has one rule (two shrine offerings, more elites, a longer boss clock, overkill, a retry that remembers). Each faith decides what you chase (wanderers, elites, Marks, loot, Embers, events).`,`**Transformations help every class the same** too: each has one strength (bosses, normal foes, gold, Embers, piercing) and one weakness. Race and transformation trees now raise damage from every source.`,`**Gems**: a rare currency from great chests, first special-boss wins, achievements and weekly tasks. **Reshape** your class, race or faith for 10 gems. Saves from before this update get 10 gems once.`,`**Harder escapes**: escape foes are bigger again; expect to reach the gate with seconds to spare.`,`Worse drops (Rare and below) are salvaged for gold at once (a setting turns this off), and the "cast spells" quest lights up the buttons to tap.`]},{h:`New in 2.3`,items:[`**Elite foes** from stage 26: about 1 foe in 8 is Armoured, Swift or Warded, and pays 5x gold.`,`**Weak spots**: on bosses and elites a glowing ✸ appears and waits for you. Tap it for x3 damage; it comes back 2 s later somewhere else.`,`**Hunts**: every few minutes a short side goal is offered (kill elites, hit weak spots, beat a boss fast). Take it or ignore it.`,`**The Toll Collector**: a new event that asks. Double gold for 60 s, but your next boss has 5 s less.`,`**A third gimmick boss**: Adds. Two servants guard it; until they fall, the boss takes only 20% of your damage.`,`**Shrines**: once in each land, every life, spend gold on lantern oil (+5 s on the next boss), a blessed hand or a votive for the Named.`,`**Sellswords** (Named tab): gold buys +${Math.round(es*100)}% damage for every Named, this life only, up to 5 hires.`,`**The tithe** (Fall card): give all your gold to the Bell for up to +${Math.round(rs*100)}% Embers from that fall.`,`**Named trades**: at level 100 each Named becomes a Bossbreaker or a Reaper for the rest of the life.`]},{h:`New in 2.2`,items:[`**Seven new lands below the Bell** (stages 151 to 500), each with its own backdrop, foes, three bosses who take turns, a treasure foe and a wanderer: ${_e.slice(-7).map(e=>e.name).join(`, `)}. Past stage 500 they return as Deeper lands.`,`**${_e[5].name}** (stages ${_e[5].from} to 150): Beneath the Bell now ends at stage ${_e[5].from-1}, and a new land with its own rope-shaft backdrop, foes, bosses, treasure foe and wanderer takes the rest.`,`**Gimmick bosses** every 10th stage from 110: the Shield (your Named and pets break through) and Tolling (tap the bell). Your first win against each pays a key and Marks.`,`**Events** every few minutes from stage 26: ${Object.values($a).map(e=>e.name).join(`, `)}. A setting turns them off. Each week one element deals +${Math.round(fs*100)}%.`,`**Train perks** every 100 Train levels (pick ${ms.tap.name} or ${ms.crit.name}), and **the Gold Forge**: gold raises a worn item up to +10.`,`**Jumpscares.** Rarely, something from below comes to say hello. Menu has a switch if your heart prefers not.`,`**Every escape is tight now**: escape foes grow with the damage you deal inside the escape, so you always cut it close.`,`Every buy shows what it added, and Named milestones say what they gave. Health bar numbers no longer get cut off.`]},{h:`New in 2.1`,items:[`**Your save is safe**: a damaged save is kept, never overwritten, and a crash shows your save code instead of a blank page. After an hour of play the game reminds you once to copy your save code.`,`**Tabs cover half the screen**; the fight stays visible and tappable. Gear and Death have their own small tabs (Worn / Bag / Sets, Fall / Relics / Dungeon).`,`**A guided start** in six short steps, a *Begin now* button, and tabs that open as they start to matter.`,`**Every tap answers**: refused buys say what is missing; popups close on the first tap.`,`**Balance**: immune foes still take 20% from that element; the winter set halves the boss clock instead of stopping it; escapes are sized from the damage you really deal; the first land's bosses get 5 extra seconds${`; after your first fall, every 25th stage's boss (not the Hollow Bishop's) is a bounty paying ${br}x gold`}.`,`**Welcome back** shows your next goal, the login reward, and which Named did the work.`,`**New settings** (all off at first): Sound, Hit-stop, Big numbers as 1.23e45, Auto-cast at full mana (level 25), Auto-buy (10 relics).`,`**Words of Lanternfall**: a glossary in Menu. Hold any number at the top to see what it means.`,`**Small things**: Merge all, a pets row, set progress before you wear a piece, the first wisp lasts longer, damage numbers grow with your combo, the candle drips in its last seconds.`]},{h:`New systems`,items:[`**Elements** (Diablo II set): ${Object.values(le).join(`, `)}. From stage 26, 30% of foes are immune to one element; from stage 101, a 25% chance of a second. Immune = 0 damage; piercing lets up to 50% through. A weakness takes x${Vt}. **Every boss keeps at least one weakness.**`,`**Cleave (overkill)**: Warrior Berserker only: leftover damage carries to the next foes (up to 100% at max ranks). Pets, relics and sets add a tiny amount for everyone, at most 15% together. It never touches a boss; on stages you have cleared before it sweeps the whole stage.`,`**Tiers (v3)**: AdventureQuest-style class ladder. T1 = base class; at rank 10 the 3 subclass trials appear; own every subclass you unlock and equip one (free switch, not mid-fight). Subclasses climb T2–T7; each tier has 10 ranks earned by fighting (T1 ≈ 20 min, each tier ×2), and the next tier's trial only shows at rank 10. Tiers open nodes; class points still rank them. T7 = a subclass ultimate.`,`**Transformations by quest (v3)**: you start mortal. After quest 15 a trial offers the forms; taking one closes Mortal Master forever. Forms climb T1–T7 like classes. Hybrids follow The Unwritten: a 2nd or 3rd form only while every form is T1–T2; caps two forms T4/T3, three forms T2; every weakness applies; T7 is pure-only. Mortal Master climbs its own Mastery T1–T7 (T7: Every Morning at Once).`,`**Character creation**: step by step (Race → Class → Faith → Form → Name) with a big hero, lore, stat bars, skills and tree previews.`,`**Fewer words**: icons and numbers on every card; hold anything (or tap ?) for i
